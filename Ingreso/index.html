<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acceso</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="pantalla">

    <!-- Loader -->
    <div id="loader">

        <div id="spinner"></div>

    </div>

    <!-- Mano -->
    <div id="handContainer" class="hidden">

        <div id="hand">
            ✋
        </div>

    </div>

    <!-- Panel -->

    <div id="panel" class="hidden">

        <h1>Espera...</h1>

        <p>
            Tú no tienes acceso,
            ¿o sí?
        </p>

        <input
            id="codeInput"
            type="password"
            maxlength="4"
            placeholder="Código">

        <button id="enterBtn">

            ACCEDER

        </button>

        <div id="error"></div>

    </div>

    <!-- Canvas de partículas -->

    <canvas id="particles"></canvas>

</div>

<script src="script.js"></script>

</body>

</html>
