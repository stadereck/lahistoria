        * { -webkit-tap-highlight-color: transparent; }

        body {

            background-size: 8px 8px; background-position: 0 0, 4px 4px;
            color: var(--game-100); overflow-x: hidden; user-select: none; transition: background-color 1s ease, background-image 1s ease;
            touch-action: manipulation;
        }

        @keyframes float-up {
            0% { transform: translate3d(0, 110vh, 0) rotate(0deg) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translate3d(0, -10vh, 0) rotate(360deg) scale(1.2); opacity: 0; }
        }
        
        .particle { position: fixed; bottom: 0; border-radius: 50%; pointer-events: none; z-index: -1; will-change: transform, opacity; }

        @keyframes shake-screen {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: translate3d(-8px, 5px, 0) rotate(-1deg); }
            20%, 40%, 60%, 80% { transform: translate3d(8px, -5px, 0) rotate(1deg); }

        .screen-shake { animation: shake-screen 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

        @keyframes flash-damage { 0%, 100% { box-shadow: inset 0 0 0px transparent; } 50% { box-shadow: inset 0 0 150px rgba(239, 68, 68, 0.8); } }

        @keyframes pop-in { 0% { transform: scale(0.7) translate3d(0, 20px, 0); opacity: 0; } 80% { transform: scale(1.05) translate3d(0, -5px, 0); opacity: 1; } 100% { transform: scale(1) translate3d(0, 0, 0); opacity: 1; } }
        .animate-pop-in { animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; will-change: transform, opacity; }

        @keyframes fade-out { 0% { opacity: 1; } 100% { opacity: 0; pointer-events: none; visibility: hidden; } }
        .animate-fade-out { animation: fade-out 1s ease forwards; }

        @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }

        }

        .cartoon-btn {
            background: #fffbeb; color: var(--game-900); border: 4px solid var(--game-900); font-weight: 900; border-radius: 1rem;
            box-shadow: 0 6px 0 var(--game-900), 0 8px 10px rgba(0,0,0,0.3); transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase; position: relative; overflow: hidden; transform: translate3d(0,0,0);
        }
        .cartoon-btn:hover:not(:disabled) { transform: translateY(2px); box-shadow: 0 4px 0 var(--game-900); background: #fef3c7; }

        .cartoon-btn:disabled { background: #d1d5db; color: #9ca3af; border-color: #6b7280; box-shadow: 0 4px 0 #6b7280; transform: translateY(2px); cursor: not-allowed; opacity: 0.8; }

        .wood-control-btn { background: var(--game-700); color: var(--game-100); border: 4px solid var(--game-900); box-shadow: 0 4px 0 var(--game-900); border-radius: 0.75rem; transition: all 0.15s ease; }

        .wood-banner { background: var(--game-500); border: 4px solid var(--game-900); box-shadow: 0 4px 0 var(--game-900); position: relative; transform: rotate(-1deg); }

            const rollDiceForMove = () => { rollDiceWithAnimation((roll) => { const p = players[currPlayerIdx]; log(`🎲 ${p.name} tiró un ${roll}.`); setTimeout(() => movePlayer(p, p.pos + roll), fastAnimations ? 300 : 600); }); };

            const movePlayer = (player, targetPos) => {

                        <div className="wood-panel max-w-md w-full p-6 text-center flex flex-col gap-5 animate-pop-in z-10 shadow-2xl">
                            <span className="absolute -top-6 left-1/2 -translate-x-1/2 wood-banner text-game-900 px-8 py-1.5 rounded-xl text-lg font-black uppercase border-4 border-game-900 shadow-md">CLASES</span>
                            <div className="mt-4 flex flex-col gap-3 text-left">
                                <label className="text-sm font-bold text-game-300 uppercase block">Dificultad:</label>
                                {selectedWorld === 30 && playMode === 'historia' && <p className="text-[10px] text-red-400 font-bold animate-pulse text-center bg-red-950/50 rounded-xl p-1 border border-red-900">EL VACÍO EXIGE HARDCORE OBLIGATORIO</p>}
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                                    {['facil', 'normal', 'dificil', 'extremo', 'hardcore'].map(diff => (
                                        <button key={diff} onClick={() => { playSfx('click'); setDifficulty(diff); }} disabled={selectedWorld === 30 && playMode === 'historia' && diff !== 'hardcore'}
                                            className={`py-2 rounded-xl font-bold border-2 transition-all text-[10px] sm:text-xs uppercase disabled:opacity-30 disabled:cursor-not-allowed ${difficulty === diff ? 'bg-game-100 text-game-900 border-game-900 shadow-lg ring-2 ring-game-300 scale-105' : 'bg-game-900/60 text-game-300 border-game-900'} ${diff === 'hardcore' ? '!bg-red-900 !text-white !border-red-950' : ''}`}>
                                            {diff === 'facil' ? '👶 Fácil' : diff === 'normal' ? '😀 Normal' : diff === 'dificil' ? '👹 Difícil' : diff === 'extremo' ? '💀 EXTREMO' : '🔥 HARDCORE'}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="flex flex-col gap-2 text-left overflow-y-auto max-h-48 p-2 bg-game-900/30 rounded-xl border border-game-900 shadow-inner">
                                <label className="text-sm font-bold text-game-300 uppercase block sticky top-0 bg-transparent backdrop-blur-md pb-1 z-10 flex justify-between">Jugadores:</label>
                                {tempPlayers.map((tp, idx) => {
                                    if (!tp.heroClass) { 
                                        const hc = HERO_CLASSES[Math.floor(Math.random() * HERO_CLASSES.length)];
                                        const n = [...tempPlayers]; n[idx].heroClass = hc; setTempPlayers(n); 
                                    }
                                    return (
                                        <div key={tp.id} className="flex flex-col gap-1 bg-game-900/50 p-2 rounded-xl border border-game-900">
                                            <div className="flex items-center gap-2">
                                                <span className="w-4 h-4 rounded-full border border-game-900 flex-none shadow-sm" style={{backgroundColor: tp.colorHex}}></span>
                                                <input type="text" value={tp.name} disabled={tp.isBot} onChange={(e) => { const u = [...tempPlayers]; u[idx].name = e.target.value.substring(0, 12); setTempPlayers(u); }} className={`flex-1 px-3 py-1.5 text-xs md:text-sm rounded-xl font-bold border border-game-900 focus:outline-none shadow-inner ${tp.isBot ? 'bg-stone-400 text-stone-700' : 'bg-amber-50 text-stone-950'}`} placeholder={`Héroe ${idx + 1}`} />
                                            </div>
                                            {tp.heroClass && (
                                                <div className="text-[10px] text-game-300 font-bold ml-6 flex justify-between items-center pr-1">
                                                    <span>Clase: <span className="text-game-100">{tp.heroClass.icon} {tp.heroClass.name}</span></span>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="flex gap-2 mt-2">
                                <button onClick={() => { playSfx('click'); setGameState('menu'); }} className="flex-1 py-3 text-xs cartoon-btn !bg-red-100 !text-red-900">Atrás</button>
                                <button onClick={startDrawingPhase} className="flex-[2] py-3 cartoon-btn text-xs">Pizarrón 🖌️</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (gameState === 'drawing') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <AnimatedBackground worldId={selectedWorld} difficulty={difficulty} gameState={gameState} equippedBg={progress.equippedBg} />
                        <div className="wood-panel max-w-sm w-full p-6 text-center animate-pop-in z-10 shadow-2xl">
                            <span className="absolute -top-6 left-1/2 -translate-x-1/2 wood-banner text-game-900 px-6 py-1.5 rounded-xl text-md font-black uppercase border-4 border-game-900 shadow-md">PIZARRÓN</span>
                            <div className="mt-4">{tempPlayers[drawingIndex] && !tempPlayers[drawingIndex].isBot && ( <DrawingBoard colorHex={tempPlayers[drawingIndex].colorHex} playerName={tempPlayers[drawingIndex].name} pClass={tempPlayers[drawingIndex].heroClass} onCycleClass={() => cycleClassInSetup(drawingIndex)} onSave={handleSaveAvatar} /> )}</div>
                        </div>
                    </div>
                );
            }

            if (gameState === 'gameover' || gameState === 'boss_defeated') {
                const isVic = gameState === 'boss_defeated';
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <AnimatedBackground worldId={selectedWorld} difficulty={difficulty} gameState={gameState} equippedBg={progress.equippedBg} /> {isVic && <Confetti />}
                        <div className={`wood-panel max-w-md w-full p-8 text-center flex flex-col items-center gap-4 border-4 animate-pop-in z-10 shadow-2xl ${isVic ? 'border-yellow-500 shadow-[0_0_50px_rgba(234,179,8,0.5)]' : 'border-red-900 shadow-red-900/30'}`}>
                            <div className={`text-8xl drop-shadow-lg ${isVic ? 'animate-bounce' : 'animate-pulse'}`}>{isVic ? '👑' : '💀'}</div>
                            <h1 className={`text-3xl md:text-5xl font-black tracking-tight uppercase drop-shadow-md ${isVic ? 'text-yellow-400' : 'text-red-500'}`}>{isVic ? (winReason === 'survival' ? '¡ÚLTIMO EN PIE!' : '¡JEFE CAÍDO!') : 'GAME OVER'}</h1>
                            {isVic && winner && (
                                <div className="my-4 p-4 grid-paper rounded-2xl flex flex-col items-center gap-3 w-full">
                                    <img src={winner.avatarData} className="w-24 h-24 rounded-2xl border-4 border-game-900 bg-stone-50 shadow-md" />
                                    <h3 className="text-2xl font-bold" style={{ color: winner.colorHex }}>{winner.name}</h3>
                                    <p className="text-xs font-bold text-stone-700 text-center">{winReason === 'survival' ? 'El caos terminó.' : 'Has liberado el mundo.'}</p>
                                </div>
                            )}
                            <button onClick={handleRestart} className="w-full py-4 cartoon-btn text-lg mt-4">Menú Principal</button>
                        </div>
                    </div>
                );
            }

            const currPlayer = players[currPlayerIdx];
            const playersByPos = React.useMemo(() => {
                const map = {}; players.forEach(p => { if(!p.isDead) { if(!map[p.pos]) map[p.pos] = []; map[p.pos].push(p); } }); return map;
            }, [players]);

            const renderedBoardMap = playMode === 'aventura' ? VISUAL_ORDER_30 : (selectedWorld === 30 ? VISUAL_ORDER_42 : VISUAL_ORDER_30);

            return (
                <div className={`min-h-screen transition-colors duration-300 ${flashRed ? 'flash-red' : ''}`}>
                    <AnimatedBackground worldId={selectedWorld} difficulty={difficulty} gameState={gameState} equippedBg={progress.equippedBg} />
                    
                    <div className={`p-3 md:p-6 flex flex-col xl:flex-row gap-6 max-w-[1600px] mx-auto relative z-10 ${screenShake ? 'screen-shake' : ''}`}>
                        <div className="fixed top-3 right-3 md:top-6 md:right-6 flex gap-2 z-30">
                            <button onClick={() => { playSfx('click'); triggerFocus(currPlayer.pos); }} className="w-10 h-10 md:w-12 md:h-12 wood-control-btn flex items-center justify-center text-lg md:text-xl shadow-lg" title="Lupa"><i className="fa-solid fa-magnifying-glass"></i></button>
                            <button onClick={() => { playSfx('click'); setShowSettings(true); }} className="w-10 h-10 md:w-12 md:h-12 wood-control-btn flex items-center justify-center text-lg md:text-xl shadow-lg"><i className="fa-solid fa-gear"></i></button>
                            <button onClick={() => { playSfx('click'); setGameState('menu'); }} disabled={gameMode === 'online'} className="w-10 h-10 md:w-12 md:h-12 wood-control-btn flex items-center justify-center text-lg md:text-xl shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"><i className="fa-solid fa-home"></i></button>
                        </div>

                        {/* PANEL IZQUIERDO */}
                        <div className="flex-none xl:w-[320px] flex flex-col gap-6">
                            <div id="dice-panel" className="wood-panel p-5 flex flex-col items-center transition-all">
                                <span className="absolute -top-5 left-1/2 -translate-x-1/2 wood-banner text-game-900 px-6 py-0.5 rounded-xl text-xs font-black uppercase border-4 border-game-900 shadow-md">TURNO ACTUAL</span>
                                {currPlayer && (
                                    <div className="mt-3 flex flex-col items-center w-full">
                                        <div className="relative mb-3">
                                            <img src={currPlayer.avatarData} className={`w-20 h-20 rounded-2xl border-4 bg-stone-50 shadow-md transform transition-transform ${isRolling ? 'scale-110' : ''}`} style={{borderColor: currPlayer.colorHex}} />
                                            {currPlayer.isBot && <div className="absolute -bottom-2 -right-2 bg-blue-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full border-2 border-game-900 shadow-sm">BOT</div>}
                                        </div>
                                        <h3 className="text-xl font-bold text-center truncate w-full mb-1 drop-shadow-sm" style={{ color: currPlayer.colorHex }}>{currPlayer.name}</h3>
                                        <p className="text-[10px] font-bold text-game-300 uppercase mb-2">{currPlayer.heroClass.icon} {currPlayer.heroClass.name}</p>
                                        <p className="text-xs text-game-300 font-bold uppercase tracking-wider mb-2">Casilla: <span className="text-game-100 text-sm font-black bg-game-900/50 px-2 py-0.5 rounded-md border border-game-900">{currPlayer.pos}</span></p>
                                        {currPlayer.autoRolls !== 0 && pendingEvent && pendingEvent.isBoss && ( <p className="text-[10px] font-bold text-red-400 uppercase animate-pulse mb-1">⚠️ Jefe: Tiro Manual ⚠️</p> )}
                                        
                                        <div className="flex gap-2 w-full mt-1">
                                            <button id="btn-roll-move" onClick={rollDiceForMove} disabled={pendingEvent !== null || isRolling} className="flex-1 py-3.5 cartoon-btn text-lg transition-transform">{isRolling ? <span className="text-3xl inline-block rolling-dice">🎲 {displayDice}</span> : (displayDice && pendingEvent === null ? <span className="text-3xl inline-block animate-pop-in">🎲 {displayDice}</span> : (currPlayer.isBot ? '🤖...' : '🎲 Lanzar'))}</button>
                                            {!currPlayer.isBot && ( <button onMouseDown={startH} onMouseUp={endH} onMouseLeave={endH} onTouchStart={startH} onTouchEnd={endH} disabled={pendingEvent !== null || isRolling} className="relative w-20 cartoon-btn overflow-hidden touch-none flex-none !bg-blue-100 !border-blue-900 !text-blue-900 shadow-lg" title="Mantén presionado"><div className="absolute left-0 top-0 bottom-0 bg-blue-400 transition-all duration-75" style={{width: `${holdProgress}%`}}></div><span className="relative z-10 flex flex-col items-center justify-center h-full"><span className="text-[10px] font-black uppercase leading-tight mt-1">Nuevo</span><span className="text-xl font-black leading-none mb-1">{currPlayer.autoRolls === -1 ? '∞' : currPlayer.autoRolls}</span></span></button> )}
                                        </div>
                                    </div>
                                )}
                            </div>
                            <div className="flex-1 flex flex-col gap-4 overflow-y-auto max-h-[40vh] xl:max-h-none pr-1">
                                {players.map(p => (
                                    <div key={p.id} className={`relative rounded-2xl border-4 transition-all overflow-hidden bg-game-900 shadow-md ${p.isDead ? 'opacity-40 grayscale' : ''} ${currPlayerIdx === p.id && !p.isDead ? 'border-game-300 shadow-lg shadow-game-300/30 scale-[1.02]' : 'border-game-900'}`}>
                                        <div className="bg-game-900 p-2 md:p-3 flex items-center gap-3 border-b-2 border-game-900">
                                            <img src={p.avatarData} className="w-10 h-10 rounded-xl border border-game-900 bg-stone-50 flex-none shadow-sm" />
                                            <div className="min-w-0 flex-1">
                                                <p className="font-bold text-xs md:text-sm truncate drop-shadow-sm flex items-center justify-between" style={{ color: p.colorHex }}><span>{p.name} {p.isBot && '🤖'}</span><span className="text-[10px] text-stone-400">{p.heroClass.icon}</span></p>
                                                <div className="flex gap-2 md:gap-4 text-[10px] md:text-xs font-mono mt-0.5"><span className="text-green-400 bg-green-900/30 px-1 rounded-sm border border-green-900/50">❤️ {p.hp}</span><span className="text-blue-400 bg-blue-900/30 px-1 rounded-sm border border-blue-900/50">⚔️ {p.atk}</span></div>
                                            </div>
                                        </div>
                                        <div className="grid-paper p-2 h-20 md:h-24 overflow-y-auto text-[10px] md:text-[11px] flex flex-col gap-1">
                                            <p className="text-[9px] md:text-[10px] font-bold text-stone-500 uppercase border-b border-stone-300 pb-1 mb-1 tracking-wider">Historial:</p>
                                            {p.ledger.map((item, i) => ( <div key={i} className="flex justify-between items-center border-b border-stone-200/50 py-0.5 font-mono"><span className="text-stone-600 font-bold truncate pr-1 max-w-[60%]">{item.action}:</span><span className="marker-text text-game-900 font-extrabold whitespace-nowrap">{item.val}</span></div> ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* TABLERO */}
                        <div className="flex-1 flex items-center justify-center p-1 md:p-2">
                            <div className={`grid ${selectedWorld === 30 && playMode === 'historia' ? 'grid-cols-6 lg:grid-cols-7' : 'grid-cols-6'} gap-1 md:gap-2 max-w-5xl w-full`}>
                                {renderedBoardMap.map(num => {
                                    const cell = board[num] || { type: 'empty', label: 'Camino', icon: '🌲', desc: 'Zona segura.' };
                                    const playersHere = playersByPos[num] || [];
                                    let bgClass = "bg-game-900/40 border-game-900/60";
                                    if (num === 1) bgClass = "bg-emerald-950/60 border-emerald-700/50";
                                    else if (num === Object.keys(board).length) bgClass = "bg-red-950/60 border-red-700/50 shadow-[0_0_15px_rgba(239,68,68,0.5)]";
                                    else if (['trap', 'cliff'].includes(cell.type)) bgClass = "bg-rose-950/40 border-rose-900/50";
                                    else if (cell.type === 'potion') bgClass = "bg-green-950/30 border-green-900/50";
                                    else if (['jump', 'epic', 'merchant', 'mystery'].includes(cell.type)) bgClass = "bg-indigo-950/40 border-indigo-900/50";
                                    else if (cell.type === 'maze') bgClass = "bg-violet-950/40 border-violet-900/50";

                                    return (
                                        <div id={`cell-${num}`} key={num} className={`relative aspect-square border-2 rounded-xl md:rounded-2xl flex flex-col items-center justify-center p-0.5 md:p-1 transition-all duration-300 ${bgClass} hover:bg-game-900/70 ${focusedCell === num ? 'animate-cell-zoom' : ''}`} title={cell.desc}>
                                            <span className="absolute top-0.5 left-1 text-[8px] md:text-sm text-game-300/50 font-mono font-black">{num}</span>
                                            <span className="text-xl md:text-4xl filter drop-shadow-md mt-1 md:mt-0">{cell.icon}</span>
                                            <span className="text-[6px] md:text-[9px] leading-tight text-center font-bold text-game-100 px-0.5 hidden sm:block truncate w-full mt-1 uppercase tracking-tighter">{cell.label}</span>
                                            <div className="absolute bottom-0.5 right-0.5 sm:top-1 sm:bottom-auto flex gap-0.5 flex-wrap-reverse sm:flex-wrap justify-end max-w-[80%]">
                                                {playersHere.map(p => ( <div key={p.id} className={`w-2.5 h-2.5 md:w-4 md:h-4 rounded-full border border-game-900 shadow-lg z-10 token transition-transform hover:scale-150 ${currPlayerIdx === p.id && !isRolling ? 'animate-bounce' : ''}`} style={{ backgroundColor: p.colorHex }} title={p.name}></div> ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* CRÓNICA */}
                        <div className="flex-none xl:w-[280px] wood-panel p-4 flex flex-col h-32 md:h-48 xl:h-auto overflow-hidden">
                            <span className="absolute -top-5 left-1/2 -translate-x-1/2 wood-banner text-game-900 px-6 py-0.5 rounded-xl text-xs font-black uppercase border-4 border-game-900 shadow-md">📜 CRÓNICA</span>
                            <div className="flex-1 overflow-y-auto mt-2 flex flex-col gap-1.5 md:gap-2 text-[10px] md:text-xs font-mono text-game-300 text-left pr-1">
                                {logs.map((logStr, i) => ( <div key={i} className="pb-1 border-b border-game-900/30 text-game-100/90 animate-pop-in origin-left"><span className="text-game-500 font-bold">&gt;</span> {logStr}</div> ))}
                                <div ref={logsEndRef} id="log-end" className="h-1 flex-none" />
                            </div>
                        </div>

                        {renderModals()} {renderSettingsMenu()}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
